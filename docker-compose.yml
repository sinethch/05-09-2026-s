services:
  mongodb:
    image: mongo:latest
    container_name: mern_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/ecommerce
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - mern-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - mern-network

volumes:
  mongo-data:
    driver: local

networks:
  mern-network:
    driver: bridge
